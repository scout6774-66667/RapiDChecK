services:
  postgres:
    image: postgres:16-alpine
    container_name: rapidcheck_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruralhealth_prod}
      POSTGRES_USER: ${POSTGRES_USER:-rapidcheck_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be provided via environment}
    # PostgreSQL port 5432 is strictly internal to docker network; NOT exposed publicly to host
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rapidcheck_user} -d $${POSTGRES_DB:-ruralhealth_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./Health-AI-main/backend
      dockerfile: Dockerfile
    container_name: rapidcheck_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rapidcheck_user}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be provided}@postgres:5432/${POSTGRES_DB:-ruralhealth_prod}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Error: JWT_SECRET_KEY must be provided (>= 32 chars)}
      REVIEW_SECRET_KEY: ${REVIEW_SECRET_KEY:?Error: REVIEW_SECRET_KEY must be provided (>= 32 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      JWT_ISSUER: ${JWT_ISSUER:-rapidcheck.internal}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-rapidcheck-clinical-workforce}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Health-AI-main/frontend
      dockerfile: Dockerfile
    container_name: rapidcheck_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
